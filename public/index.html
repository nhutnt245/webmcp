<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book a flight · Demo flights</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/pages/booking.js"></script>
  </head>
  <body data-page="index">
    <header><strong>Demo flights</strong><span>Search → Choose</span></header>
    <main>
      <h1>Book a flight</h1>
      <form
        id="search-form"
        toolname="search_flights"
        tooldescription="Search fictional flights between two different airports on a travel date. A successful search opens the results page and replaces any earlier filters and selection."
        toolautosubmit
      >
        <label
          >From<select name="from" required toolparamdescription="Departure airport code: SFO, LAX or JFK.">
            <option>SFO</option>
            <option>LAX</option>
            <option>JFK</option>
          </select></label
        ><button id="swap" type="button" aria-label="Swap departure and arrival airports">⇄</button
        ><label
          >To<select
            name="to"
            required
            toolparamdescription="Arrival airport code: SFO, LAX or JFK. Must differ from the departure airport."
          >
            <option>JFK</option>
            <option>LAX</option>
            <option>SFO</option>
          </select></label
        ><label
          >Travel date<input
            name="date"
            type="date"
            value="2026-12-01"
            required
            toolparamdescription="Travel date in YYYY-MM-DD format." /></label
        ><button type="submit">Search flights</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <footer>Local demo · Fictional flights</footer>
  </body>
</html>
