<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book a flight · Demo flights</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/search-page.js"></script>
  </head>
  <body>
    <header>
      <strong>Demo flights</strong>
      <span>Search → Choose → Summary</span>
    </header>

    <main>
      <h1>Book a flight</h1>

      <!--
        WebMCP DECLARATIVE API: this form is a tool.
        toolname + tooldescription turn the form into the tool "search_flights".
        Each field becomes a tool parameter. Its "name" is the parameter name, its "required"
        and options become the schema, and toolparamdescription explains it to the agent.
        toolautosubmit lets the agent submit without a human clicking the button.
        The submit handler is in /js/search-page.js.
      -->
      <form
        id="search-form"
        toolname="search_flights"
        tooldescription="Search fictional flights between two different airports on a travel date. A successful search opens the results page."
        toolautosubmit
      >
        <div class="field">
          <label for="from">From</label>
          <select id="from" name="from" required toolparamdescription="Departure airport code: SFO, LAX or JFK.">
            <option value="SFO">SFO - San Francisco</option>
            <option value="LAX">LAX - Los Angeles</option>
            <option value="JFK">JFK - New York</option>
          </select>
        </div>

        <div class="field">
          <label for="to">To</label>
          <select
            id="to"
            name="to"
            required
            toolparamdescription="Arrival airport code: SFO, LAX or JFK. Must differ from the departure airport."
          >
            <option value="SFO">SFO - San Francisco</option>
            <option value="LAX">LAX - Los Angeles</option>
            <option value="JFK" selected>JFK - New York</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Travel date</label>
          <input
            id="date"
            name="date"
            type="date"
            value="2026-12-01"
            required
            toolparamdescription="Travel date in YYYY-MM-DD format."
          />
        </div>

        <!--
          EXPERIMENT: two form items with the same name.
          Uncomment the block below to test two form items named "date" in the same form.
          Look at in DevTools > Application > WebMCP, tool search_flights, its input schema: is "date" one property,
          two properties, or an array, and which description, default and "required" does it show?
          On a normal submit, new FormData(form) in js/search-page.js lists both "date" values and
          Object.fromEntries keeps the LAST one.
        -->
        <!--
        <div class="field">
          <label for="date-2">Second travel date (experiment: same name as the first one)</label>
          <input
            id="date-2"
            name="date"
            type="date"
            value="2026-12-15"
            required
            toolparamdescription="Second travel date in YYYY-MM-DD format (experiment: duplicate field name)."
          />
        </div>
        -->

        <button type="submit">Search flights</button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </main>

    <footer>Local demo · Fictional flights</footer>
  </body>
</html>
