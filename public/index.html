<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book a flight · Demo flights</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/pages/booking.js"></script>
  </head>
  <body data-page="index">
    <header><strong>Demo flights</strong><span>Search → Choose</span></header>
    <main>
      <h1>Book a flight</h1>
      <form id="search-form">
        <label
          >From<select name="from">
            <option>SFO</option>
            <option>LAX</option>
            <option>JFK</option>
          </select></label
        ><button id="swap" type="button" aria-label="Swap departure and arrival airports">⇄</button
        ><label
          >To<select name="to">
            <option>JFK</option>
            <option>LAX</option>
            <option>SFO</option>
          </select></label
        ><label>Travel date<input name="date" type="date" value="2026-12-01" required /></label
        ><button type="submit">Search flights</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="answer-key" hidden></section>
    </main>
    <footer>Local demo · Fictional flights</footer>
  </body>
</html>
