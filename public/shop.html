<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Shopping · Browser reach lab</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/styles.css"><script type="module" src="/pages/shop.js"></script></head>
<body><header><strong>Browser reach lab</strong><nav aria-label="Main"><a href="/index.html">Home / probes</a><a href="/booking.html">Tickets</a><a href="/shop.html">Shopping</a></nav></header>
<main><h1>Demo shop</h1><p>Browse, build a cart and place a fictional order. Use made-up details; no payment is collected.</p><p id="message" role="alert"></p>
<div id="products" class="grid"></div><section><h2>Your cart</h2><div id="cart-items" aria-live="polite"></div><p id="total"></p><p id="storage-note" class="muted"></p></section>
<form id="checkout-form" class="card" hidden><h2>Checkout</h2><label>Recipient<input name="name" required maxlength="100" autocomplete="off"></label><label>Demo delivery address<input name="address" required maxlength="300" autocomplete="off"></label><button>Place demo order</button></form><section id="receipt" role="status" hidden></section>
<aside aria-labelledby="tools-heading"><h2 id="tools-heading">Page tools</h2><p id="tool-status" role="status">Detecting WebMCP…</p><ul id="tool-list"></ul></aside>
</main><footer>Local demo · No external services · All prices and records are fictional</footer></body></html>
