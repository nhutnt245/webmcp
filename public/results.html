<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Choose a flight · Demo flights</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/pages/booking.js"></script>
  </head>
  <body data-page="results">
    <header><strong>Demo flights</strong><span>Search → Choose</span></header>
    <main>
      <h1>Choose a flight</h1>
      <p id="route"></p>
      <a id="edit-search" href="/">Edit search</a>
      <div class="results-layout">
        <aside class="results-filters">
          <form
            id="filter-form"
            toolname="filter_flights"
            tooldescription="Filter the flights on the results page. Fields you supply replace that filter; fields you omit keep their current value; an empty string clears a dropdown filter. Use clear_filters to remove all filters."
            toolautosubmit
          >
            <label
              >Maximum price (USD)<input
                name="max_price"
                type="number"
                min="0"
                step="0.01"
                toolparamdescription="Maximum price in US dollars, for example 150." /></label
            ><label
              >Departure period<select
                name="time_of_day"
                toolparamdescription="Departure period: morning (before 12:00), afternoon (12:00 to 17:59) or evening (18:00 onward). Empty means any time."
              >
                <option value="">Any time</option>
                <option>morning</option>
                <option>afternoon</option>
                <option>evening</option>
              </select></label
            ><label
              >Maximum stops<select
                name="max_stops"
                toolparamdescription="Maximum number of stops: 0, 1 or 2. Empty means any number."
              >
                <option value="">Any</option>
                <option>0</option>
                <option>1</option>
                <option>2</option>
              </select></label
            ><button type="submit">Filter flights</button
            ><button id="clear-filters" type="button" hidden>Clear filters</button>
          </form>
          <form
            id="sort-form"
            toolname="sort_flights"
            tooldescription="Sort the visible flights by price, departure time or duration, ascending or descending."
            toolautosubmit
          >
            <label
              >Sort by<select name="by" required toolparamdescription="Sort field: price, departure or duration.">
                <option value="price">Price</option>
                <option value="departure">Departure</option>
                <option value="duration">Duration</option>
              </select></label
            ><label
              >Order<select
                name="order"
                required
                toolparamdescription="Sort direction: asc (lowest first) or desc (highest first)."
              >
                <option value="asc">Ascending</option>
                <option value="desc">Descending</option>
              </select></label
            ><button type="submit">Sort flights</button>
          </form>
        </aside>
        <div id="results" class="grid"></div>
      </div>
      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <footer>Local demo · Fictional flights</footer>
  </body>
</html>
